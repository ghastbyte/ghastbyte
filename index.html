
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080d">
  <meta name="description" content="ghastbyte — software development, web projects and experiments.">
  <title>Welcome - ghastbyte</title>

  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="musicSlider.css">
  <script src="script.js" defer></script>
</head>

<body class="home-page">
  <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="assets/background.mp4" type="video/mp4">
  </video>

  <div class="background-overlay"></div>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="navbar">
    <a class="nav-logo" href="index.html" aria-label="ghastbyte home">g<span>.</span></a>

    <nav class="nav-links" aria-label="Main navigation">
      <a href="portfolio.html#about">About me</a>
      <a href="portfolio.html#projects">Projects</a>
      <a href="portfolio.html#skills">Skills</a>
      <a href="portfolio.html#contact">Contact</a>
    </nav>

    <a class="nav-cta" href="portfolio.html#contact">
      Let's talk <span>↗</span>
    </a>
  </header>

  <main class="home-content">
    <section class="profile-card">
      <div class="status">
        <span class="status-dot"></span>
        BUILDING SOMETHING NEW
      </div>

      <div class="avatar">g<span>.</span></div>

      <p class="eyebrow">SOFTWARE DEVELOPER &amp; TESTER</p>

      <h1>ghast<span>byte</span></h1>

      <p class="profile-description">
        Building things for the web.<br>
        Exploring software, backend development and new ideas.
      </p>

      <div class="tech-tags" aria-label="Technologies">
        <span>HTML</span>
        <span>CSS</span>
        <span>PHP</span>
        <span>MySQL</span>
      </div>

      <div class="profile-actions">
        <a
          class="button button-primary"
          href="https://github.com/ghastbyte"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub <span class="arrow">↗</span>
        </a>

        <a class="button button-secondary" href="portfolio.html">
          Explore portfolio <span class="arrow">→</span>
        </a>
      </div>

      <div class="card-footer">
        <span>INDEPENDENT DEVELOPER</span>
        <span>© <span id="year"></span> GHASTBYTE</span>
      </div>
    </section>

    <a class="scroll-hint" href="portfolio.html#about">
      <span class="scroll-line"></span>
      DISCOVER MORE
    </a>
  </main>

  <div class="music-control" id="music-control">
    <label class="volume-slider-wrap" for="volume-slider">
      <input
        type="range"
        id="volume-slider"
        class="volume-slider"
        min="0"
        max="100"
        value="25"
        step="1"
        aria-label="Music volume"
        title="Music volume"
      >
    </label>

    <button
      class="music-button"
      id="music-button"
      type="button"
      aria-label="Play background music"
      title="Play background music"
    >
      <svg
        class="speaker-icon"
        id="speaker-icon"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M11 5L6 9H3V15H6L11 19V5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M15.5 8.5C16.5 9.4 17 10.6 17 12C17 13.4 16.5 14.6 15.5 15.5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M18.5 5.5C20.2 7.2 21 9.5 21 12C21 14.5 20.2 16.8 18.5 18.5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>

  <audio id="background-music" loop preload="none">
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>
</body>
</html>
